name: Backend CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Compile production code
        run: ./mvnw -B -DskipTests compile

      - name: Run all backend tests
        run: ./mvnw -B test

      - name: Package backend
        run: ./mvnw -B -DskipTests package

      - name: Publish backend test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend test summary"
            echo
            echo "| Test report | Result |"
            echo "|---|---|"
            if grep -q "Failures: 0, Errors: 0" target/surefire-reports/*.txt 2>/dev/null; then
              echo "| Surefire tests | ✅ Passed |"
            else
              echo "| Surefire tests | ❌ Failed or unavailable |"
            fi
            echo
            echo "### Executed test classes"
            echo
            echo "| Test class | Tests | Failures | Errors | Skipped |"
            echo "|---|---:|---:|---:|---:|"
            for report in target/surefire-reports/*.txt; do
              [ -f "$report" ] || continue
              class_name=$(basename "$report" .txt)
              result=$(grep "Tests run:" "$report" | tail -n 1 || true)
              if [ -n "$result" ]; then
                tests=$(echo "$result" | sed -n 's/.*Tests run: \([0-9]*\), Failures: \([0-9]*\), Errors: \([0-9]*\), Skipped: \([0-9]*\).*/\1/p')
                failures=$(echo "$result" | sed -n 's/.*Tests run: \([0-9]*\), Failures: \([0-9]*\), Errors: \([0-9]*\), Skipped: \([0-9]*\).*/\2/p')
                errors=$(echo "$result" | sed -n 's/.*Tests run: \([0-9]*\), Failures: \([0-9]*\), Errors: \([0-9]*\), Skipped: \([0-9]*\).*/\3/p')
                skipped=$(echo "$result" | sed -n 's/.*Tests run: \([0-9]*\), Failures: \([0-9]*\), Errors: \([0-9]*\), Skipped: \([0-9]*\).*/\4/p')
                echo "| \`$class_name\` | $tests | $failures | $errors | $skipped |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/*.jar
          if-no-files-found: warn
