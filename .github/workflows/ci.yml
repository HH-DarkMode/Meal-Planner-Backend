name: Backend CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Compile production code
        run: ./mvnw -B -DskipTests compile

      - name: Run all backend tests
        run: ./mvnw -B test

      - name: Package backend
        run: ./mvnw -B -DskipTests package

      - name: Publish backend test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend test summary"
            echo
            echo "| Test report | Result |"
            echo "|---|---|"
            if grep -q "Failures: 0, Errors: 0" target/surefire-reports/*.txt 2>/dev/null; then
              echo "| Surefire tests | ✅ Passed |"
            else
              echo "| Surefire tests | ❌ Failed or unavailable |"
            fi
            echo
            echo "Executed test classes:"
            find target/surefire-reports -name 'TEST-*.xml' -printf '%f\n' 2>/dev/null | sort | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/*.jar
          if-no-files-found: warn
