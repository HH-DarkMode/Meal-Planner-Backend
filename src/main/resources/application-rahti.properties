spring.datasource.url=jdbc:postgresql://${DB_SERVICE_HOST}:${DB_SERVICE_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# Rahti-deploymentissa asetettava CORS_ALLOWED_ORIGINS-ympäristömuuttuja frontendin
# julkiseen osoitteeseen (esim. https://frontend-route.rahtiapp.fi). Oletusarvo pitää
# paikallisen Viten toimimassa, jos muuttujaa ei ole asetettu.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT-avain tulee Rahdin Secretistä "jwt" (JWT_SECRET). Ei oletusarvoa, jotta
# julkaisu ei voi vahingossa käyttää repossa näkyvää kehitysavainta.
app.jwt.secret=${JWT_SECRET}
# Frontend (Render) ja backend (Rahti) ovat eri sivustoilla, joten eväste tarvitsee
# Secure- ja SameSite=None-asetukset, jotta selain lähettää sen pyyntöjen mukana.
app.cookie.secure=${COOKIE_SECURE:true}
