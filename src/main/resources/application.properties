spring.application.name=demo

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.cookie.secure=${COOKIE_SECURE:false}

# Tietokantayhteys luetaan paikallisesta tiedostosta application-local.properties
# (ei versionhallinnassa). Kopioi application-local.properties.example ja täytä omat tunnukset.
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# Frontendin sallitut originit CORS:ia varten, pilkuilla eroteltuna.
# Rahti-profiili (application-rahti.properties) lukee tämän ympäristömuuttujasta.
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173
